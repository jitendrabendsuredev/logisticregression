<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Logistic Regression – MCQ Test</title><style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#5b6475;--ac:#4f46e5;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2;--bd:#dfe3ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1b1e28;--tx:#e8eaf2;--mu:#9aa3b8;--ac:#8b86ff;--ok:#4ade80;--okb:#12301f;--no:#f87171;--nob:#3a1717;--bd:#2c3040}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1b1e28;--tx:#e8eaf2;--mu:#9aa3b8;--ac:#8b86ff;--ok:#4ade80;--okb:#12301f;--no:#f87171;--nob:#3a1717;--bd:#2c3040}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}.sub{color:var(--mu);margin:0 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.q h3{font-size:1rem;margin:0 0 10px}
.o{display:block;padding:8px 10px;margin:6px 0;border:1px solid var(--bd);border-radius:8px;cursor:pointer}
.o input{margin-right:8px}.o.c{background:var(--okb);border-color:var(--ok)}.o.w{background:var(--nob);border-color:var(--no)}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;display:flex;justify-content:space-between;align-items:center;color:var(--mu)}
.btn{padding:11px 20px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.res{background:var(--card);border:2px solid var(--ac);border-radius:12px;padding:16px;margin:12px 0;font-size:1.1rem;font-weight:700}
.key{color:var(--ok);font-weight:700;margin-top:6px}
</style></head><body><div class="w"><h1>Logistic Regression – MCQ Test</h1><p class="sub">50 questions · 1 mark each</p><div id="stu"></div></div><script>var Q=[["Logistic regression is mainly used for:", ["Predicting continuous values", "Classification problems", "Clustering", "Dimensionality reduction"]], ["Despite its name, logistic regression is a:", ["Classification algorithm", "Regression algorithm for continuous output", "Clustering algorithm", "Reinforcement algorithm"]], ["The output (probability) of logistic regression lies between:", ["−∞ and ∞", "−1 and 1", "0 and 1", "1 and 100"]], ["The value of sigmoid(0) is:", ["0", "1", "−1", "0.5"]], ["The sigmoid function is:", ["1 / (1 + e^z)", "1 / (1 + e^−z)", "e^z / (1 − e^z)", "z / (1 + z)"]], ["For a very large positive z, sigmoid(z) is approximately:", ["0", "0.5", "1", "−1"]], ["For a very large negative z, sigmoid(z) is approximately:", ["0", "0.5", "1", "−1"]], ["The default probability threshold for classification is:", ["0.1", "0.25", "0.5", "0.9"]], ["Before applying the threshold, the model output is a:", ["Probability", "Class label", "Loss value", "Feature"]], ["Binary classification means the target has:", ["Two classes", "Two features", "Two rows", "Two models"]], ["Which is a logistic regression problem?", ["Predicting house price", "Predicting whether a customer will churn", "Predicting temperature", "Predicting salary"]], ["Linear regression is unsuitable for classification because:", ["It is too fast", "Predictions can go outside the 0–1 range", "It needs no data", "It has no coefficients"]], ["With two features, the decision boundary of logistic regression is a:", ["Circle", "Parabola", "Point", "Straight line"]], ["The loss function used in logistic regression is:", ["MSE", "Log loss (binary cross-entropy)", "MAE", "R² score"]], ["Log loss penalizes most heavily:", ["Confident wrong predictions", "Correct predictions", "Equal for all", "None"]], ["Which optimization method is commonly used to train it?", ["Bubble sort", "K-means", "Gradient descent", "Apriori"]], ["Odds of an event with probability p are:", ["p × (1 − p)", "p / (1 − p)", "1 − p", "p + 1"]], ["The log of odds is called:", ["Entropy", "Softmax", "Sigmoid", "Logit"]], ["If p = 0.8, the odds are:", ["0.8", "1.25", "4", "5"]], ["The logit equals:", ["p", "1 − p", "e^p", "b0 + b1x1 + b2x2 + …"]], ["For multiclass problems, logistic regression uses:", ["PCA", "K-means", "One-vs-Rest or Softmax", "Apriori"]], ["Which sklearn class is used for logistic regression?", ["LinearRegression", "LogisticRegression", "KMeans", "DecisionTreeRegressor"]], ["Correct import statement:", ["from sklearn.linear_model import LogisticRegression", "from sklearn.logistic import Logistic", "from sklearn.model import LogReg", "from sklearn.tree import Sigmoid"]], ["Which method returns class probabilities?", ["predict()", "predict_proba()", "fit()", "score()"]], ["predict() returns:", ["Probabilities", "Loss", "Coefficients", "Class labels"]], ["Parameter C in sklearn LogisticRegression is:", ["Number of classes", "Inverse of regularization strength", "Number of columns", "Threshold"]], ["A small value of C means:", ["Weaker regularization", "Stronger regularization", "No regularization", "More features"]], ["The default penalty in sklearn LogisticRegression is:", ["None", "L1", "L2", "L3"]], ["L1 regularization can:", ["Add rows", "Increase features", "Make the model slower always", "Shrink some coefficients to exactly zero"]], ["A confusion matrix is a table of:", ["Actual vs predicted classes", "Loss per epoch", "Feature names", "Optimizer steps"]], ["True Positive (TP) means:", ["Actual negative, predicted positive", "Actual positive, predicted positive", "Actual positive, predicted negative", "Actual negative, predicted negative"]], ["False Positive (FP) means:", ["Predicted positive but actually negative", "Predicted negative but actually positive", "Both correct", "Both wrong"]], ["Accuracy is:", ["TP / (TP + FP)", "TP / (TP + FN)", "(TP + TN) / Total", "FP / Total"]], ["Precision is:", ["TP / (TP + FN)", "(TP + TN) / Total", "TN / (TN + FP)", "TP / (TP + FP)"]], ["Recall is:", ["TP / (TP + FN)", "TP / (TP + FP)", "(TP + TN) / Total", "FP / (FP + TN)"]], ["F1-score is the:", ["Arithmetic mean of TP and TN", "Harmonic mean of precision and recall", "Sum of FP and FN", "Product of accuracy and loss"]], ["In disease detection, missing a sick patient is costly. Which metric matters most?", ["Precision", "Specificity", "Recall", "Loss"]], ["A spam filter that marks good emails as spam should be improved on:", ["Recall", "Precision", "Epochs", "Features"]], ["Accuracy can be misleading when the data is:", ["Imbalanced", "Balanced", "Small only", "Scaled"]], ["Data has 99 negatives and 1 positive. A model predicts all negative. Its accuracy is:", ["1%", "50%", "99%", "0%"]], ["The ROC curve plots:", ["Precision vs Recall", "TPR vs FPR", "Loss vs epochs", "Accuracy vs C"]], ["An AUC of 0.5 means the model is:", ["Perfect", "Worse than random always", "Random guessing", "Overfitted"]], ["An AUC closer to 1 indicates:", ["A better model", "A worse model", "No learning", "Missing data"]], ["Lowering the threshold from 0.5 to 0.3 usually:", ["Raises precision, lowers recall", "Raises recall, lowers precision", "Changes nothing", "Removes features"]], ["Feature scaling for logistic regression is:", ["Never useful", "Useful, especially with regularization and gradient descent", "Only for text", "Only for target"]], ["Categorical features must be:", ["Deleted", "Kept as text", "Encoded into numbers", "Used as target"]], ["A positive coefficient for a feature means:", ["Increasing it increases the log-odds of class 1", "Increasing it decreases the probability", "The feature is useless", "The feature is categorical"]], ["Highly correlated input features (multicollinearity) can make coefficients:", ["Perfect", "Unstable", "Zero always", "Negative always"]], ["The purpose of train_test_split is to:", ["Increase accuracy automatically", "Remove outliers", "Evaluate the model on unseen data", "Scale features"]], ["High training accuracy but low test accuracy indicates:", ["Underfitting", "Overfitting", "Perfect model", "Data leakage never"]]],P=[],L="ABCD",N=Q.length,done=false,S=document.getElementById("stu");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
var h='<div class="q"><h3>Student name</h3><input id="nm" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit" placeholder="Enter your full name"></div><div class="bar"><span id="cnt">Answered: 0 / '+N+'</span><span id="tm"></span></div><h2>Part A – MCQ</h2>';
Q.forEach(function(q,i){h+='<div class="q"><h3>Q'+(i+1)+'. '+esc(q[0])+'</h3>';q[1].forEach(function(o,j){h+='<label class="o"><input type="radio" name="q'+i+'" value="'+j+'">'+L[j]+'. '+esc(o)+'</label>'});h+='</div>'});
if(P.length){h+='<h2>Part B – Practical Assignments</h2>';P.forEach(function(p,i){h+='<div class="q"><h3>Assignment '+(i+1)+'. '+esc(p)+'</h3><textarea placeholder="Write your Python code / answer here"></textarea></div>'})}
h+='<button class="btn" id="sub">Submit Test</button><div id="res"></div>';S.innerHTML=h;
S.addEventListener("change",function(){var n=0;Q.forEach(function(q,i){if(S.querySelector('input[name="q'+i+'"]:checked'))n++});document.getElementById("cnt").textContent="Answered: "+n+" / "+N});
function submit(){if(done)return;done=true;if(window.iv)clearInterval(iv);var a=[];
Q.forEach(function(q,i){var c=S.querySelector('input[name="q'+i+'"]:checked');a.push((i+1)+":"+(c?L[+c.value]:"-"))});
var tx=[];S.querySelectorAll("textarea").forEach(function(t,i){tx.push("Assignment "+(i+1)+":\n"+t.value)});
var out="Name: "+document.getElementById("nm").value+"\nMCQ answers: "+a.join(" ")+(tx.length?"\n\n"+tx.join("\n\n"):"");
S.querySelectorAll("input,textarea").forEach(function(x){x.disabled=true});
document.getElementById("res").innerHTML='<div class="res">Test submitted. Copy your answers below and send them to your teacher.</div><textarea id="out" readonly style="min-height:160px"></textarea><p><button class="btn" id="cp">Copy answers</button></p>';
document.getElementById("out").value=out;
document.getElementById("cp").onclick=function(){try{navigator.clipboard.writeText(out)}catch(e){document.getElementById("out").select()}this.textContent="Copied"};
window.scrollTo(0,document.body.scrollHeight)}
document.getElementById("sub").onclick=submit;
</script></body></html>
